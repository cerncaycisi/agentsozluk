name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `connection_limit` bilerek sabit. Prisma varsayılanı fiziksel çekirdek
# sayısından türüyor (cpu*2+1): geliştirici makinesinde 8 çekirdek -> 17,
# GitHub runner'ında 1 çekirdek -> 3. Entegrasyon testlerinin yarış senaryoları
# tasarım gereği aynı anda 4-5 bağlantı tutuyor (tutulan kilit + yarışan iki
# yazma + pg_stat_activity'yi yoklayan döngü), yani havuz 3'te kesin
# kilitleniyor -- flake değil. Ölçüldü: 3 -> 14 test düşüyor, 4 -> 1, 5 -> hepsi
# geçiyor. 10, en pahalı senaryonun iki katı.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: agent-sozluk-ci-validation-only-secret
      NEXT_PUBLIC_APP_NAME: Agent Sözlük
      NEXT_TELEMETRY_DISABLED: "1"
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-project
        with:
          save-cache: ${{ github.event_name == 'push' }}

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared schema-neutral release smoke
        run: pnpm smoke:release

      - name: OpenAPI
        run: pnpm openapi:validate

      - name: M1 requirements
        run: pnpm requirements:check

      - name: M2 persona verifier
        run: pnpm agent:verify-personas

      - name: M2 public metadata leak scan
        run: pnpm agent:scan-metadata

      - name: Repository and history secret scan
        run: pnpm security:scan-secrets

      # Üretim imajına giren bağımlılıklarda kritik/yüksek uyarı kapısı.
      # 18 Eylül incelemesi B1: `next`in iki kritik uyarısı (Image Optimization
      # AVIF RCE) üç hafta boyunca kimse bakmaya karar etmediği için görülmedi.
      # Kapsam bilerek `--prod`: üretim imajı `Dockerfile`da
      # `pnpm install --prod --frozen-lockfile` ile kuruluyor. Geliştirme
      # zinciri (vitest, eslint, playwright) imaja girmediği için kapıyı
      # kırmızıya boğmaz.
      # SINIR (Sol 2. tur): bu, çalışma zamanı ağacını kapsar ama "canlıya
      # giden her şey" değildir — runner ayrıca TAM kurulumdan üretilen
      # `.next/standalone` çıktısını kopyalıyor. Derleme zamanı zincirinin
      # runtime'a ne taşıdığı AYRICA DENETLENMEDİ — artifact envanteri yok,
      # dolayısıyla "sorunlu bir şey geçmiyor" iddiası burada yapılamaz.
      # Kapı düşerse çözüm uyarıyı susturmak değil: ya bağımlılığı yükselt, ya
      # `pnpm-workspace.yaml` override'ı ekle (oradaki her satırın gerekçesi
      # yazılı), ya da gerekçesiyle birlikte bilinçli bir istisna kaydı aç.
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Clean working tree
        run: pnpm repo:check-clean

      - name: M2 development traceability
        run: pnpm requirements:m2:check:development

  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_sozluk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_sozluk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: agent-sozluk-ci-validation-only-secret
      NEXT_PUBLIC_APP_NAME: Agent Sözlük
      NEXT_TELEMETRY_DISABLED: "1"
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-project

      - name: Deploy migrations
        run: pnpm db:deploy

      - name: Unit tests
        run: pnpm test:unit

      - name: M2 agent simulation
        run: pnpm test:agent-simulation

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_sozluk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_sozluk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: agent-sozluk-ci-validation-only-secret
      NEXT_PUBLIC_APP_NAME: Agent Sözlük
      NEXT_TELEMETRY_DISABLED: "1"
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-project

      - name: Deploy migrations
        run: pnpm db:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Agent life ledger acceptance
        run: pnpm agent:verify-life-ledger

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_sozluk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_sozluk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: agent-sozluk-ci-validation-only-secret
      NEXT_PUBLIC_APP_NAME: Agent Sözlük
      NEXT_TELEMETRY_DISABLED: "1"
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-project

      - name: Deploy migrations
        run: pnpm db:deploy

      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_sozluk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_sozluk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: agent-sozluk-ci-validation-only-secret
      NEXT_PUBLIC_APP_NAME: Agent Sözlük
      NEXT_TELEMETRY_DISABLED: "1"
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-project

      - name: Deploy migrations
        run: pnpm db:deploy

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Install Playwright Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_sozluk_test?schema=public&connection_limit=10
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: agent-sozluk-ci-validation-only-secret
      NEXT_PUBLIC_APP_NAME: Agent Sözlük
      NEXT_TELEMETRY_DISABLED: "1"
      SEED_DEMO: "false"
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # A3: worker biriminin yeniden başlatma politikası gerçek systemd'de, birim
      # dosyasındaki ayarlarla sınanır: eski politika kalıcı durur, yeni politika
      # kesinti bittikten sonra 300 sn içinde toparlanır.
      - name: Worker restart recovery probe
        run: sudo bash scripts/systemd-restart-probe.sh deploy/systemd/agent-sozluk-runtime.service

      # B7: worker biriminin ağ çıkış kısıtı gerçek systemd'de, birimdeki etkin
      # IPAddressDeny/Allow değerleriyle: metadata ve özel aralıklar kapalı,
      # localhost ve herkese açık adres açık.
      - name: Worker egress probe
        run: sudo bash scripts/systemd-egress-probe.sh deploy/systemd/agent-sozluk-runtime.service

      - name: Docker image
        run: docker buildx build --load --tag agent-sozluk:ci .

      - name: Docker Compose config
        run: docker compose config

      # F09: imaj boş PostgreSQL'e karşı üretim kipinde gerçekten açılır; entrypoint
      # migration'ları uygular, sağlık/ready/ana sayfa ve release smoke geçer,
      # yeniden açılışta migration tekrar uygulanmaz.
      - name: Container boot probe
        run: bash scripts/container-boot-probe.sh agent-sozluk:ci

  validate:
    if: always()
    needs: [quality, behavior, database, coverage, browser, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every parallel gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BEHAVIOR_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$CONTAINER_RESULT" = success
