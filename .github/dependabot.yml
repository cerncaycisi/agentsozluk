# Bağımlılık uyarılarının kendiliğinden görünmesi için — 19 Eylül 2026.
# Gerekçe: 18 Eylül incelemesi B1. İki kritik `next` uyarısı, biri bakmaya
# karar verene kadar üç hafta görülmeden durdu. Bu dosya yamanın geldiğini
# haber verir.
#
# TEK BAŞINA YETMEZ ve şu an tek başına duruyor: asıl kapı `quality` işine
# eklenecek `pnpm audit --prod --audit-level=high` ve o HENÜZ YOK (bu oturumun
# GitHub jetonunda `workflow` yetkisi olmadığı için ayrı commit'e kaldı).
# Dependabot bildirimi gecikebilir, gözden kaçabilir veya merge edilmeyebilir;
# gerilemeyi durduran şey kapıdır. `PLAN.md` B1/F05 kapanışı o kapıya bağlıdır.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tek tek PR yağmuru yerine sınıf başına tek PR.
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
