# Bağımlılık uyarılarının kendiliğinden görünmesi için — 19 Eylül 2026.
# Gerekçe: 18 Eylül incelemesi B1. İki kritik `next` uyarısı, biri bakmaya
# karar verene kadar üç hafta görülmeden durdu. Bu dosya yamanın geldiğini
# haber verir.
#
# TEK BAŞINA YETMEZ: asıl kapı `quality` işindeki
# `pnpm audit --prod --audit-level=high`. Dependabot bildirimi gecikebilir,
# gözden kaçabilir veya merge edilmeyebilir; gerilemeyi DURDURAN şey kapıdır.
# Bu dosya kapının yerine değil, yanına konur: kapı yayılmayı engeller,
# dependabot yamanın geldiğini haber verir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tek tek PR yağmuru yerine sınıf başına tek PR.
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
